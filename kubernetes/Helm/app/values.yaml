# ============================================================
# Image
# ============================================================

image:
  repository: "557690622944.dkr.ecr.eu-west-2.amazonaws.com/eks-2048"
  tag: "abc123"
  pullPolicy: IfNotPresent


# ============================================================
# Deployment
# ============================================================

replicaCount: 2

strategy:
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0


# ============================================================
# Service
# ============================================================

service:
  port: 80
  targetPort: 8080


# ============================================================
# Ingress
# ============================================================

ingress:
  clusterIssuer: "letsencrypt-prod"
  className: "nginx"
  host: "ramzans-lab.com"


# ============================================================
# Cert Manager
# ============================================================

certManager:
  clusterIssuer: "letsencrypt-prod"
  email: "ramzan7871@gmail.com"
  server: "https://acme-v02.api.letsencrypt.org/directory"
  privateKeySecret: "letsencrypt-account-key"
  region: "eu-west-2"
  hostedZoneID: "Z0974659DE1C1BSWFR2U"


# ============================================================
# Resources
# ============================================================

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"

  limits:
    cpu: "500m"
    memory: "256Mi"


# ============================================================
# Health Probes
# ============================================================

probes:
  readiness:
    path: /health
    port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
    successThreshold: 1

  liveness:
    path: /health
    port: 8080
    initialDelaySeconds: 10
    periodSeconds: 20
    timeoutSeconds: 2
    failureThreshold: 3
    successThreshold: 1


# ============================================================
# Pod Security
# ============================================================

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL


# ============================================================
# Horizontal Pod Autoscaler
# ============================================================

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70


# ============================================================
# Pod Disruption Budget
# ============================================================

pdb:
  enabled: true
  minAvailable: 1


# ============================================================
# Resource Quota
# ============================================================

resourceQuota:
  requestsCpu: "2"
  requestsMemory: "2Gi"
  limitsCpu: "4"
  limitsMemory: "4Gi"
  pods: "10"


# ============================================================
# Limit Range
# ============================================================

limitRange:
  defaultCpuLimit: "500m"
  defaultMemoryLimit: "256Mi"
  defaultCpuRequest: "100m"
  defaultMemoryRequest: "128Mi"