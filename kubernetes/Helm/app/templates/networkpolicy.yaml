apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}

spec:
  podSelector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}

  policyTypes:
    - Ingress

  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx # need to get actual values rom installing controllers #
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx # need to get actual values rom installing controllers #

      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}

    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring # need to get actual values rom installing controllers #
          podSelector:
            matchLabels:
              app.kubernetes.io/name: blackbox-exporter # need to get actual values rom installing controllers #

      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}