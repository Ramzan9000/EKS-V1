name: Terraform Destroy Dev

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2
  AWS_ROLE_ARN: arn:aws:iam::557690622944:role/eks-v1-terraform-dev
  CLUSTER_NAME: eks-v1-dev

jobs:
  destroy:
    name: Terraform Destroy Dev
    runs-on: ubuntu-latest

    environment:
      name: development

    defaults:
      run:
        working-directory: terraform/envs/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Configure kubectl for EKS
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER_NAME"

      - name: Stop Argo CD reconciliation
        run: |
          echo "Disabling automated sync for all Argo CD Applications..."
          apps=$(kubectl get applications.argoproj.io -n argocd -o name 2>/dev/null || true)

          if [ -z "$apps" ]; then
            echo "No Argo CD Applications found."
            exit 0
          fi

          for app in $apps; do
            echo "Disabling automation for $app"
            kubectl patch "$app" -n argocd --type merge \
              -p '{"spec":{"syncPolicy":{"automated":null}}}' || true
          done

          echo "Argo CD automated sync/self-heal is disabled."

      - name: Prepare Argo CD Applications for cascading deletion
        run: |
          apps=$(kubectl get applications.argoproj.io -n argocd -o name 2>/dev/null || true)

          if [ -z "$apps" ]; then
            echo "No Argo CD Applications found."
            exit 0
          fi

          for app in $apps; do
            echo "Adding Argo CD resources finalizer to $app"
            kubectl patch "$app" -n argocd --type merge \
              -p '{"metadata":{"finalizers":["resources-finalizer.argocd.argoproj.io"]}}' || true
          done

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init - Argo CD Bootstrap
        working-directory: terraform/envs/argocd-bootstrap
        run: terraform init -input=false

      - name: Destroy Argo CD Bootstrap
        working-directory: terraform/envs/argocd-bootstrap
        run: terraform destroy -input=false -auto-approve -var="environment=dev"

      - name: Wait for Argo CD Applications to be deleted
        run: |
          for i in {1..60}; do
            count=$(kubectl get applications.argoproj.io -n argocd --no-headers 2>/dev/null | wc -l | tr -d ' ')
            echo "Argo CD Applications remaining: $count"

            if [ "$count" -eq 0 ]; then
              echo "All Argo CD Applications have been deleted."
              exit 0
            fi

            sleep 10
          done

          echo "ERROR: Argo CD Applications still exist after 10 minutes."
          kubectl get applications.argoproj.io -n argocd -o wide || true
          exit 1

      - name: Wait for Kubernetes LoadBalancer Services to disappear
        run: |
          for i in {1..60}; do
            remaining=$(kubectl get svc -A -o json |
              jq '[.items[] | select(.spec.type == "LoadBalancer")] | length')

            echo "LoadBalancer Services remaining: $remaining"

            if [ "$remaining" -eq 0 ]; then
              echo "All LoadBalancer Services have been removed."
              exit 0
            fi

            sleep 10
          done

          echo "ERROR: LoadBalancer Services are still present after 10 minutes."
          kubectl get svc -A
          exit 1

      - name: Wait for cluster-owned AWS load balancers to disappear
        run: |
          echo "Waiting for AWS load balancers tagged for $CLUSTER_NAME to disappear..."

          for i in {1..60}; do
            count=$(aws resourcegroupstaggingapi get-resources \
              --resource-type-filters elasticloadbalancing:loadbalancer \
              --tag-filters "Key=kubernetes.io/cluster/$CLUSTER_NAME" \
              --query 'length(ResourceTagMappingList)' \
              --output text)

            echo "Cluster-owned load balancers remaining: $count"

            if [ "$count" = "0" ] || [ "$count" = "None" ]; then
              echo "Cluster-owned load balancers have been removed."
              exit 0
            fi

            sleep 10
          done

          echo "ERROR: Cluster-owned load balancers still exist after 10 minutes."
          aws resourcegroupstaggingapi get-resources \
            --resource-type-filters elasticloadbalancing:loadbalancer \
            --tag-filters "Key=kubernetes.io/cluster/$CLUSTER_NAME" \
            --output table
          exit 1

      - name: Terraform Init - Dev
        run: terraform init -input=false

      - name: Terraform Destroy Dev Infrastructure
        run: terraform destroy -input=false -auto-approve
