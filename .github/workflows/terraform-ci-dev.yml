name: Terraform CI Dev

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"

  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2
  AWS_ROLE_ARN: arn:aws:iam::557690622944:role/eks-v1-terraform-dev

jobs:
  terraform:
    name: Terraform Dev
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/envs/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Diagnose GitHub OIDC claims
        working-directory: .
        run: |
          set -euo pipefail

          response=$(curl -sS             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")

          token=$(printf '%s' "$response" | jq -r '.value')

          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "ERROR: GitHub did not return an OIDC token."
            exit 1
          fi

          payload=$(printf '%s' "$token" | cut -d '.' -f2 | tr '_-' '/+' | base64 -d 2>/dev/null)

          echo "GitHub OIDC claims:"
          printf '%s' "$payload" | jq '{iss, aud, sub, repository, repository_id, repository_owner, repository_owner_id, ref, event_name}'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive ../../..

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          soft_fail: false

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -input=false -auto-approve tfplan
