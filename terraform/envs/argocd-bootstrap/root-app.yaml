apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: root-apps
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Ramzan9000/EKS-V1-gitops
    targetRevision: main
    path: argocd-apps

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
